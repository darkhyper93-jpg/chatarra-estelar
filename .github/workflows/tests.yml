name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Revisión del código (ESLint)
        run: npm run lint
      - name: Pruebas de lógica y simulaciones
        run: npm test
      - name: Instalar navegador
        run: npx playwright install --with-deps chromium
      - name: Pruebas en navegador (celular)
        run: npm run test:e2e
